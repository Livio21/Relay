name: android-release

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (MAJOR.MINOR.PATCH)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/relay-release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/relay-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Shared and Android tests
        run: ./gradlew :composeApp:desktopTest :androidApp:testDebugUnitTest

      - name: Assemble release APK
        run: ./gradlew :androidApp:assembleRelease -PRELAY_VERSION=${{ steps.version.outputs.version }}

      - name: Verify APK and checksum
        run: |
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          cp "$APK" "Relay-${{ steps.version.outputs.version }}.apk"
          sha256sum "Relay-${{ steps.version.outputs.version }}.apk" > "Relay-${{ steps.version.outputs.version }}.apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Relay ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            Relay-${{ steps.version.outputs.version }}.apk
            Relay-${{ steps.version.outputs.version }}.apk.sha256
